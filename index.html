<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ficha do item</title>
<style>
  :root {
    --bg: #f2f0ea;
    --panel: #ffffff;
    --ink: #17231f;
    --ink-soft: #57645d;
    --line: #d9d4c7;
    --green: #00833d;
    --green-dark: #045c2c;
    --yellow: #ffd200;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10201a; --panel: #16241e; --ink: #eef3f0; --ink-soft: #a4b3ac; --line: #2c3d34;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10201a; --panel: #16241e; --ink: #eef3f0; --ink-soft: #a4b3ac; --line: #2c3d34;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    min-height: 100%;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  .card-top {
    background: var(--yellow);
    height: 8px;
  }
  .card-body { padding: 26px 26px 24px; }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .brand img { height: 30px; width: auto; display: block; }
  .brand span {
    font-size: 0.76rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }
  h1 {
    font-size: 1.4rem;
    line-height: 1.3;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .seq {
    font-family: 'Courier New', monospace;
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-bottom: 18px;
  }
  .field {
    padding: 12px 0;
    border-top: 1px solid var(--line);
  }
  .field .k {
    font-size: 0.76rem;
    color: var(--ink-soft);
    margin-bottom: 3px;
  }
  .field .v {
    font-size: 0.98rem;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .empty-state {
    text-align: center;
    padding: 20px 0;
    color: var(--ink-soft);
    font-size: 0.92rem;
  }
  footer {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    font-size: 0.72rem;
    color: var(--ink-soft);
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="card-top"></div>
    <div class="card-body" id="card-body">
      <div class="brand">
        <img id="brand-logo" alt="" style="display:none;">
        <span>Identificação de equipamento</span>
      </div>
      <div id="content"></div>
      <footer>Escaneado para consulta - não requer login</footer>
    </div>
  </div>

  function getParams() {

    if (hash.startsWith('#')) hash = hash.slice(1);
    var params = new URLSearchParams(hash);
    var out = {};
    ['nome', 'local', 'codigo', 'qtd', 'un', 'resp', 'obs', 'seq'].forEach(function (k) {
